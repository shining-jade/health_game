<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약, 알고 먹자! — 시나리오 편집기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root {
  --bg: #f7f6f2;
  --panel: #ffffff;
  --border: #e5e2d9;
  --border2: #d0ccc0;
  --text: #2a2520;
  --sub: #7a7368;
  --sub2: #b0aa9e;
  --accent: #3a7d5c;
  --accent-bg: #eaf5ee;
  --danger: #c0392b;
  --danger-bg: #fdf0ee;
  --warn: #9a6c1a;
  --warn-bg: #fdf6e3;
  --blue: #2563a8;
  --blue-bg: #eef4fc;
  --radius: 10px;
  --radius-sm: 6px;
  --nav-w: 180px;
  --edit-accent: #6b48c8;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family:'Noto Sans KR', sans-serif; background:var(--bg); color:var(--text); font-size:13px; }

/* ── 최상단 툴바 ── */
#topbar {
  height: 46px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}
#topbar .logo { font-weight:700; font-size:14px; color:var(--accent); margin-right:8px; }
#topbar .tb-sep { width:1px; height:20px; background:var(--border); }

.tab-btn { padding:6px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:transparent; cursor:pointer; font-size:12px; font-weight:500; color:var(--sub); font-family:'Noto Sans KR',sans-serif; transition:all .15s; }
.tab-btn.on { background:var(--text); color:#fff; border-color:var(--text); }
.tab-btn:hover:not(.on) { background:var(--bg); color:var(--text); }

#topbar .ml { margin-left:auto; display:flex; gap:8px; align-items:center; }
.tb-btn { padding:6px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--panel); cursor:pointer; font-size:12px; font-weight:500; color:var(--text); font-family:'Noto Sans KR',sans-serif; transition:all .15s; display:flex; align-items:center; gap:5px; }
.tb-btn:hover { background:var(--bg); }
.tb-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.tb-btn.primary:hover { opacity:.88; }
.tb-btn.edit-mode { background:var(--edit-accent); color:#fff; border-color:var(--edit-accent); }

#edit-badge { display:none; padding:3px 10px; border-radius:20px; background:#fff3cd; color:#856404; border:1px solid #ffd166; font-size:11px; font-weight:700; }
#edit-badge.show { display:inline-flex; align-items:center; gap:4px; }

/* ── 전체 레이아웃 ── */
#layout { display:flex; height:calc(100vh - 46px); overflow:hidden; }

/* ── 좌측 네비게이션 ── */
#sidenav {
  width: var(--nav-w);
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-section { font-size:10px; font-weight:700; color:var(--sub2); padding:8px 6px 3px; letter-spacing:.06em; margin-top:4px; }
.nav-section:first-child { margin-top:0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size:11.5px;
  color: var(--sub);
  font-weight: 500;
  transition: all .12s;
  border: 1px solid transparent;
  line-height: 1.3;
}
.nav-item:hover { background:var(--bg); color:var(--text); }
.nav-item.on { background:var(--accent-bg); color:var(--accent); border-color:rgba(58,125,92,.18); font-weight:700; }
.nav-item.modified { border-color:#ffd166; background:#fff9e6; color:#856404; }
.nav-item.on.modified { background:#e8f5e6; border-color:var(--accent); }
.nav-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.nav-lbl { flex:1; line-height:1.35; }
.nav-mod-star { color:#f0a500; font-size:11px; flex-shrink:0; }

/* ── 메인 영역 ── */
#main-area { flex:1; overflow:hidden; display:flex; flex-direction:column; }

/* 탭 패널 */
.view-panel { display:none; flex:1; overflow:hidden; }
.view-panel.on { display:flex; flex-direction:column; }

/* ── 개요도 패널 ── */
#panel-overview { overflow:hidden; }
#overview-scroll { flex:1; overflow:auto; padding:16px; }

/* ── 상세도 패널 ── */
#panel-detail { }
#detail-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

/* 장면 헤더 */
.scene-hdr { display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
.scene-meta { flex:1; }
.scene-loc-lbl { font-size:11px; color:var(--sub); margin-bottom:3px; }
.scene-title-text { font-size:16px; font-weight:700; color:var(--text); line-height:1.35; }
.scene-badge { font-size:11px; padding:3px 10px; border-radius:20px; white-space:nowrap; flex-shrink:0; margin-top:2px; }
.badge-narr { background:var(--bg); color:var(--sub); border:1px solid var(--border2); }
.badge-event { background:var(--accent-bg); color:var(--accent); border:1px solid rgba(58,125,92,.3); }
.badge-end { background:var(--blue-bg); color:var(--blue); border:1px solid rgba(37,99,168,.25); }

/* 편집 가능 필드 */
[contenteditable] { outline:none; border-radius:4px; transition:box-shadow .15s, background .15s; }
[contenteditable]:focus { box-shadow:0 0 0 2px var(--edit-accent); background:rgba(107,72,200,.04); }
.editable-hint { font-size:10px; color:var(--sub2); margin-top:3px; display:none; }
.edit-active .editable-hint { display:block; }

/* 상황 박스 */
.situation-wrap { margin-bottom:18px; }
.situation-lbl { font-size:10px; font-weight:700; color:var(--sub2); letter-spacing:.05em; margin-bottom:5px; }
.situation-box {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 13px 16px;
  font-size:13px;
  line-height:1.75;
  color:var(--text);
  border-left:3px solid var(--border2);
  min-height:44px;
}

/* 선택지 */
.choices-section { }
.choices-lbl { font-size:10px; font-weight:700; color:var(--sub2); letter-spacing:.05em; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.add-choice-btn { padding:2px 10px; border-radius:20px; border:1px dashed var(--border2); background:transparent; cursor:pointer; font-size:11px; color:var(--sub); font-family:'Noto Sans KR',sans-serif; }
.add-choice-btn:hover { border-color:var(--edit-accent); color:var(--edit-accent); }

.choice-card {
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
  position: relative;
  border-left: 4px solid;
  transition: box-shadow .15s;
}
.choice-card:last-child { margin-bottom:0; }
.choice-good { background:var(--accent-bg); border-color:var(--accent); }
.choice-bad { background:var(--danger-bg); border-color:var(--danger); }
.choice-mid { background:var(--warn-bg); border-color:var(--warn); }

.choice-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.choice-type-sel {
  padding:2px 8px;
  border-radius:20px;
  border:1px solid;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  background:transparent;
}
.sel-good { border-color:var(--accent); color:var(--accent); }
.sel-bad { border-color:var(--danger); color:var(--danger); }
.sel-mid { border-color:var(--warn); color:var(--warn); }
.del-choice-btn { margin-left:auto; padding:2px 8px; border-radius:20px; border:1px solid var(--border); background:transparent; cursor:pointer; font-size:11px; color:var(--sub); font-family:'Noto Sans KR',sans-serif; display:none; }
.edit-active .del-choice-btn { display:inline-block; }
.del-choice-btn:hover { border-color:var(--danger); color:var(--danger); background:var(--danger-bg); }

.choice-text-field { font-size:12.5px; font-weight:500; color:var(--text); min-height:20px; margin-bottom:8px; line-height:1.55; }

/* 델타 칩 */
.delta-row { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; align-items:center; }
.delta-chip {
  display: inline-flex;
  align-items: center;
  gap:3px;
  font-size:11px;
  font-weight:700;
  padding:2px 9px;
  border-radius:20px;
  cursor:default;
}
.chip-plus { background:#d1fae5; color:#065f46; }
.chip-minus { background:#fee2e2; color:#991b1b; }
.add-delta-btn { padding:2px 9px; border-radius:20px; border:1px dashed var(--border2); background:transparent; cursor:pointer; font-size:11px; color:var(--sub); font-family:'Noto Sans KR',sans-serif; display:none; }
.edit-active .add-delta-btn { display:inline-flex; }
.add-delta-btn:hover { border-color:var(--edit-accent); color:var(--edit-accent); }
.delta-chip.editable-chip { cursor:pointer; }
.delta-chip.editable-chip:hover { opacity:.75; }

.note-field { font-size:11.5px; color:var(--sub); border-top:1px solid rgba(0,0,0,.07); padding-top:6px; min-height:16px; line-height:1.55; }
.result-field { font-size:11.5px; color:var(--sub); font-style:italic; min-height:16px; line-height:1.55; margin-top:4px; }

/* 장면 이동 버튼 */
.nav-btns { display:flex; gap:8px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
.nav-scene-btn { padding:7px 16px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--panel); cursor:pointer; font-size:12px; font-weight:500; color:var(--text); font-family:'Noto Sans KR',sans-serif; }
.nav-scene-btn:hover { background:var(--bg); }

/* ── 개요도 그리드 ── */
.ov-grid { display:grid; gap:4px; }
.ov-day-row { display:flex; gap:4px; align-items:flex-start; }
.ov-day-lbl { width:52px; flex-shrink:0; font-size:10px; font-weight:700; color:var(--sub); padding-top:8px; text-align:right; padding-right:8px; }
.ov-scenes { display:flex; gap:4px; flex-wrap:wrap; align-items:flex-start; }
.ov-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding:8px 10px;
  cursor:pointer;
  transition:all .15s;
  min-width:160px;
  max-width:230px;
  border-left:3px solid;
}
.ov-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.1); transform:translateY(-1px); }
.ov-card.on { box-shadow:0 0 0 2px var(--accent); }
.ov-card.modified { background:#fff9e6; }
.ov-card-type { font-size:10px; font-weight:700; letter-spacing:.04em; margin-bottom:3px; }
.ov-card-title { font-size:12px; font-weight:700; color:var(--text); line-height:1.35; margin-bottom:5px; }
.ov-choices-mini { display:flex; flex-direction:column; gap:2px; }
.ov-choice-mini { font-size:10px; padding:2px 6px; border-radius:3px; color:var(--sub); display:flex; gap:4px; }
.ovc-good { background:var(--accent-bg); color:var(--accent); }
.ovc-bad { background:var(--danger-bg); color:var(--danger); }
.ovc-mid { background:var(--warn-bg); color:var(--warn); }
.ov-arrow { display:flex; align-items:center; padding-top:18px; color:var(--border2); font-size:16px; }

/* ── 모달 ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:999;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.modal-box {
  background:var(--panel); border-radius:14px; padding:24px 28px;
  max-width:420px; width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.modal-box h3 { font-size:15px; font-weight:700; margin-bottom:8px; }
.modal-box p { font-size:12.5px; color:var(--sub); line-height:1.7; margin-bottom:16px; }
.modal-row { display:flex; gap:8px; flex-wrap:wrap; }
.modal-btn { flex:1; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); cursor:pointer; font-size:13px; font-weight:500; font-family:'Noto Sans KR',sans-serif; text-align:center; }
.modal-btn.ok { background:var(--accent); color:#fff; border-color:var(--accent); }
.modal-btn.cancel { background:var(--panel); color:var(--sub); }

/* 델타 편집 미니 폼 */
.delta-form { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px; }
.delta-form input, .delta-form select {
  padding:4px 8px; border-radius:var(--radius-sm); border:1px solid var(--border2);
  font-size:12px; font-family:'Noto Sans KR',sans-serif; background:var(--panel); color:var(--text);
}
.delta-form input[type=number] { width:72px; }
.delta-form select { width:100px; }
.delta-form button { padding:4px 10px; border-radius:var(--radius-sm); border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; font-size:12px; font-family:'Noto Sans KR',sans-serif; }

/* 토스트 */
#toast { position:fixed; bottom:24px; right:24px; z-index:9999;
  background:#2a2520; color:#fff; padding:10px 18px; border-radius:var(--radius);
  font-size:13px; font-weight:500; opacity:0; transform:translateY(8px);
  transition:all .25s; pointer-events:none; }
#toast.show { opacity:1; transform:translateY(0); }

/* ── 장면 액션 툴바 (편집모드 상세도 상단) ── */
#scene-action-bar {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: #fdf8ff;
  border-bottom: 1px solid #e8d8f8;
  flex-shrink: 0;
}
#scene-action-bar.show { display: flex; }
.sa-btn {
  display: inline-flex; align-items: center; gap:4px;
  padding: 5px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--panel);
  cursor: pointer; font-size:12px; font-weight:500;
  color: var(--text); font-family:'Noto Sans KR',sans-serif;
  transition: all .13s; white-space: nowrap;
}
.sa-btn:hover { background: var(--bg); }
.sa-btn.danger { color: var(--danger); border-color: #f5c6c0; }
.sa-btn.danger:hover { background: var(--danger-bg); }
.sa-btn.purple { color: var(--edit-accent); border-color: #d8c8f4; }
.sa-btn.purple:hover { background: #f5f0ff; }
.sa-sep { width:1px; height:18px; background:var(--border); margin:0 2px; }
.sa-day-wrap { display:flex; align-items:center; gap:6px; margin-left:auto; }
.sa-day-wrap label { font-size:11px; color:var(--sub); }
.sa-day-inp {
  width: 64px; padding: 4px 8px;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  font-size:12px; font-family:'Noto Sans KR',sans-serif;
  background: var(--panel); color:var(--text);
}
.sa-type-sel {
  padding: 4px 8px; border:1px solid var(--border2); border-radius: var(--radius-sm);
  font-size:12px; font-family:'Noto Sans KR',sans-serif;
  background: var(--panel); color:var(--text); cursor:pointer;
}

/* ── 장면 추가 모달 ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:999; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-box { background:var(--panel); border-radius:16px; padding:28px 32px; max-width:460px; width:100%; box-shadow:0 24px 60px rgba(0,0,0,.2); }
.modal-box h3 { font-size:15px; font-weight:700; margin-bottom:6px; }
.modal-box p { font-size:12.5px; color:var(--sub); line-height:1.7; margin-bottom:18px; }
.modal-field { margin-bottom:14px; }
.modal-field label { display:block; font-size:11px; font-weight:700; color:var(--sub2); margin-bottom:5px; letter-spacing:.04em; }
.modal-field input, .modal-field select, .modal-field textarea {
  width:100%; padding:8px 12px; border:1px solid var(--border2); border-radius:var(--radius-sm);
  font-size:13px; font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text);
}
.modal-field textarea { resize:vertical; min-height:72px; line-height:1.6; }
.modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { outline:none; border-color:var(--edit-accent); }
.modal-row { display:flex; gap:8px; }
.modal-btn { flex:1; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border); cursor:pointer; font-size:13px; font-weight:500; font-family:'Noto Sans KR',sans-serif; text-align:center; background:var(--bg); color:var(--text); }
.modal-btn.ok { background:var(--edit-accent); color:#fff; border-color:var(--edit-accent); }
.modal-btn.cancel { background:var(--panel); color:var(--sub); }

/* ── 네비 - 순서 변경 버튼 ── */
.nav-item { position:relative; }
.nav-item:hover .nav-reorder { opacity:1; }
.nav-reorder { opacity:0; transition:.12s; display:flex; gap:1px; margin-left:auto; flex-shrink:0; }
.nav-reorder-btn { width:16px; height:16px; border:none; background:transparent; cursor:pointer; font-size:11px; color:var(--sub2); padding:0; line-height:1; border-radius:3px; }
.nav-reorder-btn:hover { background:var(--border); color:var(--text); }

/* 삭제 확인 인라인 */
.confirm-del { background:#fff2f0; border:1px solid #ffbdad; border-radius:var(--radius); padding:12px 14px; margin-top:12px; display:flex; align-items:center; gap:10px; }
.confirm-del p { font-size:12.5px; color:var(--danger); flex:1; line-height:1.5; }
.confirm-del button { padding:6px 14px; border-radius:var(--radius-sm); border:none; cursor:pointer; font-size:12px; font-weight:700; font-family:'Noto Sans KR',sans-serif; }
.btn-confirm-yes { background:var(--danger); color:#fff; }
.btn-confirm-no { background:var(--border); color:var(--text); }

/* ── 반응형 ── */
@media(max-width:900px) {
  :root { --nav-w: 140px; }
}
</style>
</head>
<body>

<!-- ── 툴바 ── -->
<div id="topbar">
  <span class="logo">💊 시나리오 편집기</span>
  <div class="tb-sep"></div>
  <button class="tab-btn on" onclick="switchView('overview',this)">개요도</button>
  <button class="tab-btn" onclick="switchView('detail',this)">상세도</button>
  <span id="edit-badge">✏️ 편집 모드</span>
  <div class="ml">
    <button class="tb-btn" id="edit-toggle-btn" onclick="toggleEditMode()">✏️ 편집 모드</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="undo-btn" onclick="undoAction()" title="실행취소 (Ctrl+Z)" disabled style="opacity:.4">↩ 실행취소</button>
    <button class="tb-btn" id="redo-btn" onclick="redoAction()" title="다시실행 (Ctrl+Y)" disabled style="opacity:.4">↪ 다시실행</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="triggerLoad()">📂 JSON 불러오기</button>
    <button class="tb-btn primary" onclick="saveJSON()">💾 JSON 저장</button>
    <input type="file" id="file-inp" accept=".json" style="display:none" onchange="loadJSON(this)">
  </div>
</div>

<!-- ── 레이아웃 ── -->
<div id="layout">

  <!-- 좌측 네비 -->
  <div id="sidenav" id="sidenav"></div>

  <!-- 메인 -->
  <div id="main-area">

    <!-- 개요도 패널 -->
    <div class="view-panel on" id="panel-overview">
      <div id="overview-scroll"></div>
    </div>

    <!-- 상세도 패널 -->
    <div class="view-panel" id="panel-detail">
      <!-- 장면 액션 툴바 -->
      <div id="scene-action-bar">
        <button class="sa-btn purple" onclick="openAddModal('before')">＋ 앞에 추가</button>
        <button class="sa-btn purple" onclick="openAddModal('after')">＋ 뒤에 추가</button>
        <div class="sa-sep"></div>
        <button class="sa-btn" onclick="duplicateScene()">⧉ 복제</button>
        <button class="sa-btn" onclick="moveScene(-1)">↑ 위로</button>
        <button class="sa-btn" onclick="moveScene(1)">↓ 아래로</button>
        <div class="sa-sep"></div>
        <button class="sa-btn danger" onclick="showDeleteConfirm()">🗑 이 장면 삭제</button>
        <div class="sa-day-wrap">
          <label>DAY</label>
          <input class="sa-day-inp" type="text" id="sa-day-inp" placeholder="1~14 또는 ending" onchange="changeSceneDay(this.value)">
          <label>유형</label>
          <select class="sa-type-sel" id="sa-type-sel" onchange="changeSceneType(this.value)">
            <option value="event">이벤트</option>
            <option value="narration">나레이션</option>
            <option value="ending">엔딩</option>
          </select>
        </div>
      </div>
      <div id="detail-content"></div>
    </div>

  </div>

    text:'6가지 누적 능력치(건강·지식·활력·수면·카페인관리·판단력)로 레이더 차트 생성. 누적 플래그(labelChecked·comboMedCaffeine·helpedFriend 등) 기반 맞춤 피드백 표시.', choices:[]},

let SCENES = JSON.parse(JSON.stringify(DEFAULT_SCENES));
let modified = new Set();
let currentIdx = 0;
let editMode = false;
let currentView = 'overview';

// ── 히스토리 (실행취소/다시실행) ──
const HISTORY_MAX = 50;
let _history = [];   // [{scenes, modified, currentIdx, desc}, ...]
let _histPtr = -1;   // 현재 포인터 (히스토리 내 위치)
let _skipSnapshot = false; // 복원 중 snapshot 방지

function snapshot(desc) {
  if (_skipSnapshot) return;
  // 포인터 이후 미래 히스토리 제거 (새 작업 시작)
  _history = _history.slice(0, _histPtr + 1);
  _history.push({
    scenes: JSON.parse(JSON.stringify(SCENES)),
    modified: new Set(modified),
    idx: currentIdx,
    desc: desc || '변경'
  });
  if (_history.length > HISTORY_MAX) _history.shift();
  _histPtr = _history.length - 1;
  updateUndoRedoBtns();
}

function undoAction() {
  if (_histPtr <= 0) return;
  _histPtr--;
  restoreSnapshot(_history[_histPtr]);
  toast('↩ 실행취소: ' + (_history[_histPtr + 1]?.desc || ''));
}

function redoAction() {
  if (_histPtr >= _history.length - 1) return;
  _histPtr++;
  restoreSnapshot(_history[_histPtr]);
  toast('↪ 다시실행: ' + (_history[_histPtr]?.desc || ''));
}

function restoreSnapshot(snap) {
  _skipSnapshot = true;
  SCENES = JSON.parse(JSON.stringify(snap.scenes));
  modified = new Set(snap.modified);
  currentIdx = Math.min(snap.idx, SCENES.length - 1);
  _skipSnapshot = false;
  renderSidenav();
  renderDetail(currentIdx);
  if (currentView === 'overview') renderOverview();
  updateUndoRedoBtns();
}

function updateUndoRedoBtns() {
  const undoBtn = document.getElementById('undo-btn');
  const redoBtn = document.getElementById('redo-btn');
  const canUndo = _histPtr > 0;
  const canRedo = _histPtr < _history.length - 1;
  if (undoBtn) {
    undoBtn.disabled = !canUndo;
    undoBtn.style.opacity = canUndo ? '1' : '.4';
    const prev = _history[_histPtr - 1];
    undoBtn.title = canUndo ? ('실행취소: ' + (_history[_histPtr]?.desc || '') + ' (Ctrl+Z)') : '실행취소할 내용 없음';
  }
  if (redoBtn) {
    redoBtn.disabled = !canRedo;
    redoBtn.style.opacity = canRedo ? '1' : '.4';
    redoBtn.title = canRedo ? ('다시실행: ' + (_history[_histPtr + 1]?.desc || '') + ' (Ctrl+Y)') : '다시실행할 내용 없음';
  }
}

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('edit-toggle-btn');
  const badge = document.getElementById('edit-badge');
  const actionBar = document.getElementById('scene-action-bar');
  if (editMode) {
    btn.textContent = '✏️ 편집 종료';
    btn.className = 'tb-btn edit-mode';
    badge.classList.add('show');
    document.body.classList.add('edit-active');
    actionBar.classList.add('show');
  } else {
    btn.textContent = '✏️ 편집 모드';
    btn.className = 'tb-btn';
    badge.classList.remove('show');
    document.body.classList.remove('edit-active');
    actionBar.classList.remove('show');
    hideDeleteConfirm();
  }
  if (currentView === 'detail') renderDetail(currentIdx);
  else renderOverview();
}

function switchView(id, btn) {
  currentView = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));

  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('on'));

function renderSidenav() {
  const nav = document.getElementById('sidenav');
  const days = [...new Set(SCENES.map(s => s.day))];
  let html = '';
  days.forEach(d => {
    const label = d === 'ending' ? '엔딩' : `DAY ${d}`;
    html += `<div class="nav-section">${label}</div>`;
    SCENES.filter(s => s.day === d).forEach((sc, _) => {
      const idx = SCENES.indexOf(sc);
      const col = DAY_COLORS[sc.day] || '#888';
      const isOn = idx === currentIdx ? ' on' : '';
      const isMod = modified.has(sc.id) ? ' modified' : '';
      const modStar = modified.has(sc.id) ? '<span class="nav-mod-star">●</span>' : '';
      const shortTitle = sc.title.replace(/[★🏫🏪🌙🛒🏃🍱🏸☕📱🩺📚😣📝📊]/g,'').trim().slice(0,12);
      html += `<div class="nav-item${isOn}${isMod}" onclick="selectScene(${idx})">
        <span class="nav-dot" style="background:${col}"></span>
        <span class="nav-lbl">${shortTitle}</span>
        ${modStar}
      </div>`;
    });

    html += `<div style="margin-top:8px;padding:6px 4px">
      <button onclick="openAddModal('after')" style="width:100%;padding:6px 8px;border-radius:var(--radius-sm);border:1px dashed #c084fc;background:transparent;cursor:pointer;font-size:11px;color:#6b48c8;font-family:inherit;text-align:left">＋ 새 장면 추가</button>
    </div>`;

}

      <div style="width:58px;flex-shrink:0;font-size:11px;font-weight:700;color:${col};padding-top:10px;text-align:right;padding-right:10px;border-right:2px solid ${col}22;margin-right:10px">${dayLabel}</div>

      html += `<div class="ov-card${isOn ? ' on' : ''}${isMod ? ' modified' : ''}"
        style="border-left-color:${borderCol};cursor:pointer"

function openAddAtDay(day) {
  // 해당 DAY의 마지막 장면 인덱스를 찾아 currentIdx로 설정 후 after로 추가
  let lastIdx = -1;
  SCENES.forEach((sc, i) => { if (String(sc.day) === String(day)) lastIdx = i; });
  if (lastIdx >= 0) {
    currentIdx = lastIdx;
    renderSidenav();
  }
  _addModalPos = 'after';
  openAddModal('after');
  // DAY 필드 자동 채우기
  setTimeout(() => {
    const inp = document.getElementById('m-day');
    if (inp) inp.value = day;
  }, 50);
}

function selectSceneAndSwitch(idx) {
  currentIdx = idx;
  // 상세도로 전환
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('on',i===1));
  document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('panel-detail').classList.add('on');
  currentView = 'detail';
  renderSidenav();
  renderDetail(idx);
}

function selectScene(idx) {
  currentIdx = idx;
  renderSidenav();
  if (currentView === 'detail') renderDetail(idx);
  else renderOverview();
}

function markModified(id, desc) {
  modified.add(id);
  snapshot(desc || '내용 수정');
  renderSidenav();
}

function renderDetail(idx) {
  const sc = SCENES[idx];
  const cont = document.getElementById('detail-content');
  // 액션바 DAY/유형 동기화
  const dayInp = document.getElementById('sa-day-inp');
  const typeSelEl = document.getElementById('sa-type-sel');
  if (dayInp) dayInp.value = sc.day;
  if (typeSelEl) typeSelEl.value = sc.type;
  hideDeleteConfirm();
  const badgeCls = sc.type === 'narration' ? 'badge-narr' : sc.type === 'ending' ? 'badge-end' : 'badge-event';
  const typeLabel = sc.type === 'narration' ? '나레이션' : sc.type === 'ending' ? '엔딩' : '이벤트';

  let choicesHTML = '';
  if (sc.choices && sc.choices.length) {
    const addBtn = editMode ? `<button class="add-choice-btn" onclick="addChoice(${idx})">+ 선택지 추가</button>` : '';
    choicesHTML = `<div class="choices-section">
      <div class="choices-lbl">선택지 및 능력치 변화 ${addBtn}</div>`;
    sc.choices.forEach((ch, ci) => {
      choicesHTML += renderChoiceCard(idx, ci, ch);
    });
    choicesHTML += `</div>`;
  } else if (editMode && sc.type === 'event') {
    choicesHTML = `<div class="choices-section">
      <div class="choices-lbl">선택지 및 능력치 변화 <button class="add-choice-btn" onclick="addChoice(${idx})">+ 선택지 추가</button></div>
    </div>`;
  } else if (sc.type === 'narration') {
    choicesHTML = `<div style="font-size:12.5px;color:var(--sub);font-style:italic;padding:8px 0">선택 없음 — 나레이션으로 진행</div>`;
  } else if (sc.type === 'ending') {
    choicesHTML = `<div style="font-size:12.5px;color:var(--sub);font-style:italic;padding:8px 0">6가지 누적 능력치 기반 레이더 차트 생성 및 피드백 표시</div>`;

    : `<div class="scene-loc-lbl">${esc(sc.loc)}</div>`;

  const titleEdit = editMode
    ? `<div contenteditable="true" class="scene-title-text" style="cursor:text" onblur="editField('${sc.id}','title',this.textContent)">${esc(sc.title)}</div>
       <div class="editable-hint">↑ 제목 클릭하여 편집</div>`
    : `<div class="scene-title-text">${esc(sc.title)}</div>`;

  const textEdit = editMode
    ? `<div contenteditable="true" class="situation-box" style="cursor:text" onblur="editField('${sc.id}','text',this.textContent)">${esc(sc.text)}</div>
       <div class="editable-hint">↑ 클릭하여 상황 설명 편집</div>`
    : `<div class="situation-box">${esc(sc.text)}</div>`;

  const navBtns = `<div class="nav-btns">
    ${idx > 0 ? `<button class="nav-scene-btn" onclick="selectScene(${idx-1})">← 이전 장면</button>` : ''}

  cont.innerHTML = `
    <div class="scene-hdr">

function renderChoiceCard(scIdx, ci, ch) {
  const sc = SCENES[scIdx];
  const cardCls = ch.type === 'good' ? 'choice-good' : ch.type === 'bad' ? 'choice-bad' : 'choice-mid';
  const selCls = ch.type === 'good' ? 'sel-good' : ch.type === 'bad' ? 'sel-bad' : 'sel-mid';

  // 타입 선택 (편집모드)
  const typeCtrl = editMode
    ? `<select class="choice-type-sel ${selCls}" onchange="editChoiceType(${scIdx},${ci},this.value)">
        <option value="good" ${ch.type==='good'?'selected':''}>✓ 올바른</option>
        <option value="bad" ${ch.type==='bad'?'selected':''}>✗ 위험</option>
        <option value="mid" ${ch.type==='mid'?'selected':''}>△ 절충</option>
      </select>`
    : `<span style="font-size:11px;font-weight:700;color:${TYPE_COLORS[ch.type]}">${TYPE_LABELS[ch.type]}</span>`;

  const delBtn = `<button class="del-choice-btn" onclick="deleteChoice(${scIdx},${ci})">삭제</button>`;

  // 선택지 텍스트
  const textField = editMode
    ? `<div contenteditable="true" class="choice-text-field" onblur="editChoiceField(${scIdx},${ci},'text',this.textContent)">${esc(ch.text)}</div>`
    : `<div class="choice-text-field">${esc(ch.text)}</div>`;

  // 델타 칩
  let deltaHTML = '<div class="delta-row">';
  if (ch.delta) {
    Object.entries(ch.delta).forEach(([k,v]) => {
      if (v === 0) return;
      const chipCls = v > 0 ? 'chip-plus' : 'chip-minus';
      if (editMode) {
        deltaHTML += `<span class="delta-chip ${chipCls} editable-chip" title="클릭하여 삭제" onclick="removeDelta(${scIdx},${ci},'${k}')">${k} ${v>0?'+':''}${v} ✕</span>`;
      } else {
        deltaHTML += `<span class="delta-chip ${chipCls}">${k} ${v>0?'+':''}${v}</span>`;
      }
    });
  }
  if (editMode) {
    deltaHTML += `<button class="add-delta-btn" onclick="showDeltaForm(${scIdx},${ci})">+ 능력치</button>`;
  }
  deltaHTML += `</div>`;

  // 델타 추가 폼 (편집모드)
  const deltaFormId = `df-${scIdx}-${ci}`;
  const deltaForm = editMode ? `
    <div class="delta-form" id="${deltaFormId}" style="display:none">
      <select id="${deltaFormId}-key">${STAT_KEYS.map(k=>`<option>${k}</option>`).join('')}</select>
      <input type="number" id="${deltaFormId}-val" value="5" style="width:70px">
      <button onclick="addDelta(${scIdx},${ci},'${deltaFormId}')">추가</button>
    </div>` : '';

  // 노트
  const noteField = ch.note
    ? (editMode
        ? `<div contenteditable="true" class="note-field" onblur="editChoiceField(${scIdx},${ci},'note',this.textContent)">📌 ${esc(ch.note)}</div>`
        : `<div class="note-field">📌 ${esc(ch.note)}</div>`)
    : (editMode ? `<div contenteditable="true" class="note-field" placeholder="플래그/메모 입력..." onblur="editChoiceField(${scIdx},${ci},'note',this.textContent.replace('📌 ',''))">📌 </div>` : '');

  // 피드백
  const resultField = ch.result
    ? (editMode
        ? `<div contenteditable="true" class="result-field" onblur="editChoiceField(${scIdx},${ci},'result',this.textContent)">💬 ${esc(ch.result)}</div>`
        : `<div class="result-field">💬 ${esc(ch.result)}</div>`)
    : '';

  return `<div class="choice-card ${cardCls}" id="cc-${scIdx}-${ci}">
    <div class="choice-top">
      ${typeCtrl}
      ${delBtn}
    </div>
    ${textField}
    ${deltaHTML}
    ${deltaForm}
    ${noteField}
    ${resultField}
  </div>`;
}

// ══════════════════════════════════════════
// 8. 편집 액션
// ══════════════════════════════════════════
function editField(id, field, val) {
  const sc = SCENES.find(s => s.id === id);
  if (!sc) return;
  if (sc[field] === val) return;
  sc[field] = val;
  markModified(id, field + ' 수정');
  toast('저장됨');
}

function editChoiceField(scIdx, ci, field, val) {
  const sc = SCENES[scIdx];
  if (!sc || !sc.choices[ci]) return;
  if (field === 'note') val = val.replace(/^📌\s*/,'');
  if (field === 'result') val = val.replace(/^💬\s*/,'');
  if (sc.choices[ci][field] === val) return;
  sc.choices[ci][field] = val;
  markModified(sc.id, '선택지 ' + field + ' 수정');
  toast('저장됨');
}

function editChoiceType(scIdx, ci, val) {
  const sc = SCENES[scIdx];
  sc.choices[ci].type = val;
  markModified(sc.id, '선택지 유형 변경');
  renderDetail(scIdx);
  toast('선택지 유형 변경됨');
}

function removeDelta(scIdx, ci, key) {
  const sc = SCENES[scIdx];
  delete sc.choices[ci].delta[key];
  markModified(sc.id, key + ' 능력치 제거');
  renderDetail(scIdx);
  toast(`'${key}' 능력치 제거됨`);
}

function showDeltaForm(scIdx, ci) {
  const id = `df-${scIdx}-${ci}`;
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'flex' : 'none';
}

function addDelta(scIdx, ci, formId) {
  const key = document.getElementById(formId+'-key').value;
  const val = parseInt(document.getElementById(formId+'-val').value);
  if (!key || isNaN(val)) return;
  const sc = SCENES[scIdx];
  if (!sc.choices[ci].delta) sc.choices[ci].delta = {};
  sc.choices[ci].delta[key] = val;
  markModified(sc.id, key + ' 능력치 추가');
  renderDetail(scIdx);
  toast(`'${key}' ${val>0?'+':''}${val} 추가됨`);
}

function addChoice(scIdx) {
  const sc = SCENES[scIdx];
  sc.choices.push({ type:'good', text:'새 선택지', delta:{}, note:'', result:'' });
  markModified(sc.id, '선택지 추가');
  renderDetail(scIdx);
  toast('선택지 추가됨');
}

function deleteChoice(scIdx, ci) {
  const sc = SCENES[scIdx];
  sc.choices.splice(ci, 1);
  markModified(sc.id, '선택지 삭제');
  renderDetail(scIdx);
  toast('선택지 삭제됨');
}

// ══════════════════════════════════════════
// 9. 장면 추가 / 삭제 / 순서변경 / 복제
// ══════════════════════════════════════════

let _addModalPos = 'after'; // 'before' | 'after'

function openAddModal(pos) {
  _addModalPos = pos;
  const curSc = SCENES[currentIdx];
  const defDay = curSc ? curSc.day : 1;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3>새 장면 추가</h3>
        <p>현재 장면 <b>${pos === 'before' ? '앞' : '뒤'}</b>에 새 장면이 삽입됩니다.</p>
        <div class="modal-field">
          <label>제목</label>
          <input type="text" id="m-title" placeholder="장면 제목을 입력하세요" value="새 장면">
        </div>
        <div class="modal-field">
          <label>DAY (숫자 또는 ending)</label>
          <input type="text" id="m-day" value="${defDay}">
        </div>
        <div class="modal-field">
          <label>위치 (장소 설명)</label>
          <input type="text" id="m-loc" placeholder="예) 📚 자습실">
        </div>
        <div class="modal-field">
          <label>유형</label>
          <select id="m-type">
            <option value="event">이벤트 (선택지 있음)</option>
            <option value="narration">나레이션 (선택지 없음)</option>
          </select>
        </div>
        <div class="modal-field">
          <label>상황 설명</label>
          <textarea id="m-text" placeholder="이 장면에서 어떤 상황이 벌어지나요?"></textarea>
        </div>
        <div class="modal-row">
          <button class="modal-btn cancel" onclick="closeModal()">취소</button>
          <button class="modal-btn ok" onclick="confirmAddScene()">추가</button>
        </div>
      </div>
    </div>`;
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal-root').innerHTML = '';
}

function confirmAddScene() {
  const title = document.getElementById('m-title').value.trim() || '새 장면';
  const rawDay = document.getElementById('m-day').value.trim();
  const day = rawDay === 'ending' ? 'ending' : (parseInt(rawDay) || 1);
  const loc = document.getElementById('m-loc').value.trim();
  const type = document.getElementById('m-type').value;
  const text = document.getElementById('m-text').value.trim();

  const newId = 'sc_' + Date.now();
  const newScene = { id: newId, day, loc, type, title, text, choices: [] };

  const insertAt = _addModalPos === 'before' ? currentIdx : currentIdx + 1;
  SCENES.splice(insertAt, 0, newScene);
  modified.add(newId);
  currentIdx = insertAt;
  snapshot('장면 추가: ' + title);

  closeModal();
  renderSidenav();
  renderDetail(currentIdx);
  if (currentView === 'overview') renderOverview();
  toast('✅ 장면이 추가되었습니다');
}

function duplicateScene() {
  const sc = SCENES[currentIdx];
  const copy = JSON.parse(JSON.stringify(sc));
  copy.id = 'sc_' + Date.now();
  copy.title = copy.title + ' (복제)';
  SCENES.splice(currentIdx + 1, 0, copy);
  modified.add(copy.id);
  currentIdx = currentIdx + 1;
  snapshot('장면 복제: ' + copy.title);
  renderSidenav();
  renderDetail(currentIdx);
  if (currentView === 'overview') renderOverview();
  toast('⧉ 장면이 복제되었습니다');
}

function moveScene(dir) {
  const to = currentIdx + dir;
  if (to < 0 || to >= SCENES.length) { toast('더 이상 이동할 수 없습니다'); return; }
  const tmp = SCENES[currentIdx];
  SCENES[currentIdx] = SCENES[to];
  SCENES[to] = tmp;
  modified.add(SCENES[to].id);
  modified.add(SCENES[currentIdx].id);
  currentIdx = to;
  snapshot(dir < 0 ? '장면 위로 이동' : '장면 아래로 이동');
  renderSidenav();
  renderDetail(currentIdx);
  if (currentView === 'overview') renderOverview();
  toast(dir < 0 ? '↑ 위로 이동됨' : '↓ 아래로 이동됨');
}

function changeSceneDay(val) {
  const sc = SCENES[currentIdx];
  const day = val === 'ending' ? 'ending' : (parseInt(val) || sc.day);
  sc.day = day;
  markModified(sc.id, 'DAY 변경');
  renderSidenav();
  if (currentView === 'overview') renderOverview();
  toast('DAY 변경됨');
}

function changeSceneType(val) {
  const sc = SCENES[currentIdx];
  sc.type = val;
  if (val === 'narration' || val === 'ending') sc.choices = [];
  markModified(sc.id, '유형 변경');
  renderDetail(currentIdx);
  renderSidenav();
  if (currentView === 'overview') renderOverview();
  toast('유형 변경됨');
}

let _deleteConfirmShown = false;
function showDeleteConfirm() {
  if (_deleteConfirmShown) { hideDeleteConfirm(); return; }
  _deleteConfirmShown = true;
  const cont = document.getElementById('detail-content');
  const existing = document.getElementById('del-confirm');
  if (existing) { existing.remove(); _deleteConfirmShown = false; return; }
  const sc = SCENES[currentIdx];
  const div = document.createElement('div');
  div.id = 'del-confirm';
  div.className = 'confirm-del';
  div.innerHTML = `<p>⚠️ "<b>${sc.title}</b>" 장면을 삭제할까요? 이 작업은 되돌릴 수 없습니다.</p>
    <button class="btn-confirm-no" onclick="hideDeleteConfirm()">취소</button>
    <button class="btn-confirm-yes" onclick="confirmDeleteScene()">삭제</button>`;
  cont.insertBefore(div, cont.firstChild);
}

function hideDeleteConfirm() {
  _deleteConfirmShown = false;
  const el = document.getElementById('del-confirm');
  if (el) el.remove();
}

function confirmDeleteScene() {
  if (SCENES.length <= 1) { toast('마지막 장면은 삭제할 수 없습니다'); hideDeleteConfirm(); return; }
  const sc = SCENES[currentIdx];
  const delTitle = sc.title;
  SCENES.splice(currentIdx, 1);
  modified.delete(sc.id);
  currentIdx = Math.min(currentIdx, SCENES.length - 1);
  snapshot('장면 삭제: ' + delTitle);
  hideDeleteConfirm();
  renderSidenav();
  renderDetail(currentIdx);
  if (currentView === 'overview') renderOverview();
  toast('🗑 장면이 삭제되었습니다');
}

// ══════════════════════════════════════════
// 10. JSON 저장 / 불러오기
// ══════════════════════════════════════════
// 마지막 저장자 이름 기억
let _lastAuthor = localStorage.getItem('sc_author') || '';

function saveJSON() {
  const today = new Date();
  const dateStr = today.toISOString().slice(0,10).replace(/-/g,'');

  // 수정된 장면 목록 수집
  const modScenes = SCENES.filter(sc => modified.has(sc.id));
  const modListHTML = modScenes.length
    ? modScenes.map(sc => `<li style="padding:2px 0">${esc(sc.title)}</li>`).join('')
    : '<li style="color:var(--sub2);font-style:italic">없음 (변경사항 없음)</li>';

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()" style="max-width:500px">
        <h3>💾 JSON 저장</h3>
        <p style="margin-bottom:14px">저장자 이름과 메모는 파일 내부에 기록됩니다.<br>파일명은 <b>날짜 + 이름</b>만 사용해 간결하게 유지돼요.</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
          <div class="modal-field" style="margin:0">
            <label>저장자 이름 <span style="color:var(--danger)">*</span></label>
            <input type="text" id="s-author" placeholder="예) 김선생님" value="${esc(_lastAuthor)}" maxlength="20">
          </div>
          <div class="modal-field" style="margin:0">
            <label>파일명 미리보기</label>
            <div id="s-preview" style="padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11.5px;font-family:monospace;color:var(--text);min-height:34px;word-break:break-all"></div>
          </div>
        </div>

        <div class="modal-field">
          <label>수정 메모 — 어떤 내용을 바꿨나요? (파일 내부 기록용)</label>
          <input type="text" id="s-memo" placeholder="예) DAY5 게보린 선택지 능력치 조정, DAY3 피드백 텍스트 수정" maxlength="100">
        </div>

        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:18px">
          <div style="font-size:10px;font-weight:700;color:var(--sub2);letter-spacing:.04em;margin-bottom:7px">수정된 장면 (${modScenes.length}개) — 파일 내부에 목록으로 기록됩니다</div>
          <ul style="list-style:none;font-size:12px;color:var(--text);max-height:100px;overflow-y:auto;line-height:1.6">
            ${modListHTML}
          </ul>
        </div>

        <div class="modal-row">
          <button class="modal-btn cancel" onclick="closeModal()">취소</button>
          <button class="modal-btn ok" onclick="confirmSaveJSON()">저장하기</button>
        </div>
      </div>
    </div>`;

  const authorInp = document.getElementById('s-author');
  const preview   = document.getElementById('s-preview');

  function updatePreview() {
    const safeName = authorInp.value.trim().replace(/[^가-힣a-zA-Z0-9]/g,'') || '이름없음';
    preview.textContent = `scenario_${dateStr}_${safeName}.json`;
  }
  authorInp.addEventListener('input', updatePreview);
  updatePreview();
  authorInp.focus();
  authorInp.select();

  [authorInp, document.getElementById('s-memo')].forEach(inp => {
    inp?.addEventListener('keydown', e => { if (e.key === 'Enter') confirmSaveJSON(); });
  });
}

function confirmSaveJSON() {
  const authorInp = document.getElementById('s-author');
  const memoInp   = document.getElementById('s-memo');
  if (!authorInp) return;

  const author = authorInp.value.trim();
  if (!author) {
    authorInp.focus();
    authorInp.style.borderColor = 'var(--danger)';
    authorInp.placeholder = '이름을 입력해주세요';
    return;
  }

  _lastAuthor = author;
  localStorage.setItem('sc_author', author);

  const dateStr  = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const safeName = author.replace(/[^가-힣a-zA-Z0-9]/g,'');
  const filename = `scenario_${dateStr}_${safeName}.json`;

  // 수정된 장면 제목 목록
  const modSceneList = SCENES
    .filter(sc => modified.has(sc.id))
    .map(sc => ({ id: sc.id, title: sc.title, day: sc.day }));

  const data = {
    version:      2,
    exportedAt:   new Date().toISOString(),
    author,
    memo:         memoInp?.value.trim() || '',
    modifiedScenes: modSceneList,
    scenes:       SCENES
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();

  closeModal();
  modified.clear();
  renderSidenav();
  toast(`💾 ${filename} 저장 완료`);
}

function showLoadSummaryModal(data) {
  const author    = data.author    || '';
  const memo      = data.memo      || '';
  const dateStr   = (data.exportedAt || '').slice(0, 10);
  const modList   = Array.isArray(data.modifiedScenes) ? data.modifiedScenes : [];
  const sceneCount = Array.isArray(data.scenes) ? data.scenes.length : 0;

  const modHTML = modList.length
    ? modList.map(sc => `
        <div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:11px;background:var(--accent-bg);color:var(--accent);border-radius:3px;padding:1px 6px;white-space:nowrap">DAY ${sc.day}</span>
          <span style="font-size:12.5px">${esc(sc.title)}</span>
        </div>`).join('')
    : `<div style="font-size:12px;color:var(--sub2);font-style:italic;padding:6px 0">기록 없음</div>`;

  const authorRow = author
    ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
         <span style="font-size:13px;font-weight:700">${esc(author)}</span>
         <span style="font-size:11px;color:var(--sub);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 9px">${dateStr}</span>
       </div>`
    : `<div style="font-size:12px;color:var(--sub);margin-bottom:10px">저장자 정보 없음</div>`;

  const memoRow = memo
    ? `<div style="background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:8px 12px;margin-bottom:14px;font-size:12.5px;color:var(--text);line-height:1.6">
         💬 ${esc(memo)}
       </div>`
    : '';

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()" style="max-width:480px">
        <h3>📂 불러오기 완료</h3>

        ${authorRow}
        ${memoRow}

        <div style="font-size:10px;font-weight:700;color:var(--sub2);letter-spacing:.04em;margin-bottom:8px">
          수정된 장면 기록 (${modList.length}개) · 전체 ${sceneCount}개 장면
        </div>
        <div style="max-height:200px;overflow-y:auto;margin-bottom:18px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px">
          ${modHTML}
        </div>

        <div class="modal-row">
          <button class="modal-btn ok" onclick="closeModal()">확인</button>
        </div>
      </div>
    </div>`;
}

function triggerLoad() {
  document.getElementById('file-inp').click();
}

function loadJSON(inp) {
  const file = inp.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const loaded = data.scenes || data;
      if (!Array.isArray(loaded)) throw new Error('scenes 배열 없음');
      SCENES = loaded;
      modified.clear();
      currentIdx = 0;
      snapshot('파일 불러오기');
      renderSidenav();
      renderDetail(0);
      if (currentView === 'overview') renderOverview();
      showLoadSummaryModal(data);
    } catch(err) {
      alert('파일 형식이 올바르지 않습니다.\n' + err.message);
    }
    inp.value = '';
  };
  reader.readAsText(file);
}

// ══════════════════════════════════════════
// 11. 유틸
// ══════════════════════════════════════════
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg, duration) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration || 2200);
}

// ══════════════════════════════════════════
// 12. 초기화
// ══════════════════════════════════════════
// 키보드 단축키
document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undoAction(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redoAction(); }
});

renderSidenav();
renderDetail(0);
renderOverview();
// 초기 스냅샷
snapshot('초기 상태');
</script>
</body>
</html>
