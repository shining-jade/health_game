<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보건 미스터리 파일 - 시나리오 에디터</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --line: #d7e1f0;
      --line-strong: #b8c8df;
      --text: #172033;
      --muted: #64748b;
      --primary: #3867d6;
      --primary-soft: #eaf0ff;
      --green: #16835f;
      --green-soft: #e9f8f1;
      --red: #d14343;
      --red-soft: #fff0f0;
      --amber: #a96800;
      --amber-soft: #fff7df;
      --radius: 10px;
      --shadow: 0 12px 28px rgba(22, 34, 51, 0.08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      font-size: 14px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .brand {
      min-width: 210px;
    }

    .brand strong {
      display: block;
      font-size: 17px;
      letter-spacing: 0;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 34px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      background: var(--panel);
      color: var(--text);
      font-weight: 800;
      line-height: 1;
    }

    .btn:hover {
      background: var(--panel-soft);
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn.green {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }

    .btn.red {
      border-color: #efb0b0;
      background: var(--red-soft);
      color: var(--red);
    }

    .btn.is-active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .status {
      min-width: 145px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 390px;
      min-height: 0;
    }

    .sidebar,
    .preview {
      min-height: 0;
      overflow: auto;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .preview {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .panel-head {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .search {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--text);
      outline: none;
      font-weight: 700;
    }

    .scene-list {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .scene-item {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
    }

    .scene-item:hover,
    .scene-item.is-active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .scene-item.is-dirty {
      box-shadow: inset 4px 0 0 var(--amber);
    }

    .scene-item__top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .scene-item__title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 900;
    }

    .scene-item__meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .editor {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card h2,
    .card h3 {
      margin: 0;
      font-size: 16px;
    }

    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
      font-weight: 700;
      line-height: 1.5;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    textarea.code {
      min-height: 220px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      font-weight: 500;
      white-space: pre;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 103, 214, 0.12);
    }

    .choice-list,
    .witness-list {
      display: grid;
      gap: 10px;
    }

    .choice-card,
    .witness-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .choice-card__top,
    .witness-card__top {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .choice-card__top strong,
    .witness-card__top strong {
      margin-right: auto;
    }

    .mini-btn {
      min-height: 28px;
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
    }

    .mini-btn.red {
      border-color: #efb0b0;
      color: var(--red);
      background: var(--red-soft);
    }

    .mini-btn.green {
      border-color: #9edabb;
      color: var(--green);
      background: var(--green-soft);
    }

    .preview-body {
      padding: 14px;
    }

    .preview-scene {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .preview-scene h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .dialogue {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      font-weight: 800;
      line-height: 1.65;
    }

    .dialogue strong {
      display: inline-flex;
      margin-bottom: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 12px;
    }

    .preview-choices {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .preview-choice {
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      font-weight: 900;
    }

    .flow-board {
      display: grid;
      gap: 12px;
      min-height: calc(100vh - 120px);
    }

    .flow-toolbar {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
    }

    .flow-toolbar strong {
      margin-right: auto;
    }

    .flow-wrap {
      overflow: auto;
      min-height: 680px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(rgba(215, 225, 240, 0.42) 1px, transparent 1px),
        linear-gradient(90deg, rgba(215, 225, 240, 0.42) 1px, transparent 1px),
        #fbfdff;
      background-size: 28px 28px;
      box-shadow: var(--shadow);
    }

    .flow-canvas {
      position: relative;
      min-width: 1280px;
      min-height: 760px;
      padding: 34px;
    }

    .flow-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .flow-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, 250px);
      grid-auto-rows: minmax(132px, auto);
      gap: 82px 56px;
      align-items: start;
    }

    .flow-node {
      min-height: 132px;
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      text-align: left;
      box-shadow: 0 12px 26px rgba(22, 34, 51, 0.08);
    }

    .flow-node:hover,
    .flow-node.is-active {
      border-color: var(--primary);
      box-shadow: 0 14px 32px rgba(56, 103, 214, 0.18);
    }

    .flow-node.is-dirty {
      box-shadow: inset 5px 0 0 var(--amber), 0 12px 26px rgba(22, 34, 51, 0.08);
    }

    .flow-node__head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .flow-node__title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 900;
    }

    .flow-node__dialogue {
      display: -webkit-box;
      min-height: 42px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .flow-node__choices {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 10px;
    }

    .flow-chip {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 10px;
      font-weight: 900;
    }

    .flow-missing {
      border-color: #efb0b0;
      background: var(--red-soft);
      color: var(--red);
    }

    .flow-line {
      fill: none;
      stroke: rgba(56, 103, 214, 0.62);
      stroke-width: 2.2;
      marker-end: url(#arrowHead);
    }

    .flow-line.is-selected {
      stroke: rgba(22, 131, 95, 0.9);
      stroke-width: 3;
    }

    .flow-label {
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 5px;
      stroke-linejoin: round;
      fill: #334155;
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
    }

    .flow-empty {
      padding: 28px;
      color: var(--muted);
      font-weight: 800;
    }

    .export-drawer {
      display: none;
      position: fixed;
      inset: 64px 24px 24px;
      z-index: 40;
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.22);
    }

    .export-drawer.is-open {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .export-head,
    .export-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .export-head h2 {
      margin: 0;
      margin-right: auto;
      font-size: 18px;
    }

    #exportText {
      height: 100%;
      min-height: 0;
    }

    @media (max-width: 1160px) {
      .layout {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .preview {
        display: none;
      }
    }

    @media (max-width: 780px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions,
      .status {
        width: 100%;
        justify-content: flex-start;
        text-align: left;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: 280px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .grid,
      .grid.three {
        grid-template-columns: 1fr;
      }

      .flow-canvas {
        min-width: 980px;
      }

      .flow-grid {
        grid-template-columns: repeat(3, 240px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>시나리오 에디터</strong>
        <span>대사 · 선택지 · 사건 패널 수정</span>
      </div>
      <div class="top-actions">
        <button class="btn is-active" type="button" id="editViewBtn">편집</button>
        <button class="btn" type="button" id="flowViewBtn">흐름지도</button>
        <button class="btn" type="button" id="saveDraftBtn">임시저장</button>
        <button class="btn" type="button" id="loadDraftBtn">임시저장 불러오기</button>
        <button class="btn green" type="button" id="downloadBtn">수정본 다운로드</button>
        <button class="btn primary" type="button" id="exportBtn">Codex 반영용 내보내기</button>
        <button class="btn red" type="button" id="resetBtn">처음 상태로</button>
      </div>
      <div class="status" id="statusText">데이터 불러오는 중</div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="panel-head">
          <h2 class="panel-title">장면 목록</h2>
          <input class="search" id="sceneSearch" placeholder="장면 제목, 대사, 선택지 검색">
        </div>
        <div class="scene-list" id="sceneList"></div>
      </aside>

      <section class="editor" id="editor"></section>

      <aside class="preview">
        <div class="panel-head">
          <h2 class="panel-title">미리보기</h2>
          <p class="hint">실제 게임 화면과 완전히 같지는 않지만, 대사와 선택지 흐름을 빠르게 확인할 수 있습니다.</p>
        </div>
        <div class="preview-body" id="preview"></div>
      </aside>
    </main>
  </div>

  <section class="export-drawer" id="exportDrawer" aria-hidden="true">
    <div class="export-head">
      <h2>Codex 반영용 출력</h2>
      <button class="btn" type="button" id="copyExportBtn">복사</button>
      <button class="btn" type="button" id="closeExportBtn">닫기</button>
    </div>
    <textarea class="code" id="exportText" spellcheck="false"></textarea>
    <div class="export-actions">
      <p class="hint">이 내용을 Codex에게 붙여넣으면 `assets/data/case01_game_data.js`에 반영하기 쉽습니다. 바로 배포하려면 다운로드한 파일을 같은 경로에 덮어쓴 뒤 발행하면 됩니다.</p>
    </div>
  </section>

  <script src="./assets/data/case01_game_data.js"></script>
  <script>
    const STORAGE_KEY = "healthGameScenarioEditor.case01.draft";
    const originalData = structuredClone(window.gameData);
    let data = structuredClone(window.gameData);
    let selectedSceneId = data.episodes[0]?.scenes[0]?.id || "";
    let activeView = "edit";
    const dirtySceneIds = new Set();

    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value = "") => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const scenes = () => data.episodes.flatMap((episode) => episode.scenes.map((scene) => ({ episode, scene })));
    const getSelectedScene = () => scenes().find((item) => item.scene.id === selectedSceneId)?.scene || scenes()[0]?.scene;
    const lineArray = (value) => Array.isArray(value) ? value.join("\n") : "";
    const parseLines = (value) => value.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
    const markDirty = (sceneId = selectedSceneId) => {
      dirtySceneIds.add(sceneId);
      updateStatus();
      renderSceneList();
      if (activeView === "flow") window.requestAnimationFrame(drawFlowLines);
    };

    const updateStatus = (message) => {
      const count = dirtySceneIds.size;
      $("#statusText").textContent = message || (count ? `${count}개 장면 수정됨` : "수정 없음");
    };

    const renderSceneList = () => {
      const query = $("#sceneSearch").value.trim().toLowerCase();
      const list = $("#sceneList");
      const items = scenes().filter(({ scene }) => {
        if (!query) return true;
        const haystack = [
          scene.id,
          scene.title,
          scene.location,
          scene.dialogue?.name,
          scene.dialogue?.text,
          ...(scene.choices || []).map((choice) => choice.text)
        ].join(" ").toLowerCase();
        return haystack.includes(query);
      });

      list.innerHTML = items.map(({ scene }) => `
        <button class="scene-item${scene.id === selectedSceneId ? " is-active" : ""}${dirtySceneIds.has(scene.id) ? " is-dirty" : ""}" type="button" data-scene-id="${escapeHtml(scene.id)}">
          <span class="scene-item__top">
            <span class="badge">${escapeHtml(scene.stepLabel || "-")}</span>
            <span class="scene-item__title">${escapeHtml(scene.title || scene.id)}</span>
          </span>
          <span class="scene-item__meta">${escapeHtml(scene.location || "")} · 선택지 ${(scene.choices || []).length}개</span>
        </button>
      `).join("");
    };

    const renderEditor = () => {
      if (activeView === "flow") {
        renderFlowMap();
        return;
      }

      const scene = getSelectedScene();
      if (!scene) {
        $("#editor").innerHTML = "<p>편집할 장면이 없습니다.</p>";
        return;
      }

      $("#editor").innerHTML = `
        <section class="card">
          <div class="card-head">
            <div>
              <h2>${escapeHtml(scene.title || scene.id)}</h2>
              <p class="hint">${escapeHtml(scene.id)} · ${escapeHtml(scene.stepLabel || "")}</p>
            </div>
            <button class="btn" type="button" data-action="duplicate-scene">장면 복제</button>
          </div>
          <div class="grid three">
            ${field("장면 ID", "id", scene.id, "text", true)}
            ${field("장면 제목", "title", scene.title)}
            ${field("단계 라벨", "stepLabel", scene.stepLabel)}
            ${field("단계/분류", "phase", scene.phase)}
            ${field("장소", "location", scene.location)}
            ${field("배경 이미지 경로", "background", scene.background)}
            ${field("배경 대체 텍스트", "backgroundAlt", scene.backgroundAlt, "text", false, "full")}
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h3>대사</h3>
          </div>
          <div class="grid">
            ${field("말하는 사람", "dialogue.name", scene.dialogue?.name || "")}
            ${field("활성 화자 위치", "speaker", scene.speaker || "", "select-speaker")}
            ${field("대사 내용", "dialogue.text", scene.dialogue?.text || "", "textarea", false, "full")}
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <div>
              <h3>선택지</h3>
              <p class="hint">선택지 문구, 이동할 장면, 잠금 조건을 수정할 수 있습니다.</p>
            </div>
            <button class="btn green" type="button" data-action="add-choice">선택지 추가</button>
          </div>
          <div class="choice-list">
            ${(scene.choices || []).map((choice, index) => choiceEditor(choice, index)).join("") || "<p class='hint'>선택지가 없습니다.</p>"}
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h3>사건 패널</h3>
          </div>
          <div class="grid">
            ${field("증상: 한 줄에 하나씩", "casePanel.symptoms", lineArray(scene.casePanel?.symptoms), "textarea")}
            ${field("확인된 사실: 한 줄에 하나씩", "casePanel.facts", lineArray(scene.casePanel?.facts), "textarea")}
            ${field("아직 불확실한 점: 한 줄에 하나씩", "casePanel.unknowns", lineArray(scene.casePanel?.unknowns), "textarea", false, "full")}
          </div>
        </section>

        ${interactionEditor(scene)}

        <section class="card">
          <div class="card-head">
            <h3>고급 JSON</h3>
          </div>
          <p class="hint">핫스팟, 뉴스레터, 약품 검색 같은 복잡한 상호작용은 JSON으로 세밀하게 조정할 수 있습니다.</p>
          ${field("interaction JSON", "interaction", JSON.stringify(scene.interaction || null, null, 2), "code", false, "full")}
          ${field("investigation JSON", "investigation", JSON.stringify(scene.investigation || null, null, 2), "code", false, "full")}
        </section>
      `;
      renderPreview();
    };

    const getSceneMap = () => new Map(scenes().map(({ scene }) => [scene.id, scene]));

    const truncate = (value = "", length = 26) => {
      const text = String(value).replace(/\s+/g, " ").trim();
      return text.length > length ? `${text.slice(0, length - 1)}…` : text;
    };

    const renderFlowMap = () => {
      const allScenes = scenes().map(({ scene }) => scene);
      $("#editor").innerHTML = `
        <section class="flow-board">
          <div class="flow-toolbar">
            <strong>선택지 흐름지도</strong>
            <span class="badge">장면 ${allScenes.length}개</span>
            <span class="badge">선택지 ${allScenes.reduce((sum, scene) => sum + (scene.choices || []).length, 0)}개</span>
            <button class="btn" type="button" data-action="fit-flow">처음 위치로</button>
          </div>
          <div class="flow-wrap" id="flowWrap">
            <div class="flow-canvas" id="flowCanvas">
              <svg class="flow-svg" id="flowSvg" aria-hidden="true">
                <defs>
                  <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M 0 0 L 10 4 L 0 8 z" fill="rgba(56, 103, 214, 0.72)"></path>
                  </marker>
                </defs>
              </svg>
              <div class="flow-grid">
                ${allScenes.map((scene) => flowNode(scene)).join("") || "<p class='flow-empty'>표시할 장면이 없습니다.</p>"}
              </div>
            </div>
          </div>
        </section>
      `;
      renderPreview();
      window.requestAnimationFrame(drawFlowLines);
    };

    const flowNode = (scene) => {
      const choices = scene.choices || [];
      return `
        <button class="flow-node${scene.id === selectedSceneId ? " is-active" : ""}${dirtySceneIds.has(scene.id) ? " is-dirty" : ""}" type="button" data-flow-node="${escapeHtml(scene.id)}">
          <span class="flow-node__head">
            <span class="badge">${escapeHtml(scene.stepLabel || "-")}</span>
            <span class="flow-node__title">${escapeHtml(scene.title || scene.id)}</span>
          </span>
          <span class="flow-node__dialogue">${escapeHtml(scene.dialogue?.text || "")}</span>
          <span class="flow-node__choices">
            ${choices.length ? choices.map((choice) => `<span class="flow-chip">${escapeHtml(truncate(choice.text, 18))}</span>`).join("") : "<span class='flow-chip flow-missing'>선택지 없음</span>"}
          </span>
        </button>
      `;
    };

    const drawFlowLines = () => {
      const svg = $("#flowSvg");
      const canvas = $("#flowCanvas");
      if (!svg || !canvas) return;

      const marker = svg.querySelector("defs")?.outerHTML || "";
      const sceneMap = getSceneMap();
      const canvasRect = canvas.getBoundingClientRect();
      const edges = [];

      scenes().forEach(({ scene }) => {
        (scene.choices || []).forEach((choice, index) => {
          if (!choice.nextSceneId || !sceneMap.has(choice.nextSceneId)) return;
          const from = canvas.querySelector(`[data-flow-node="${CSS.escape(scene.id)}"]`);
          const to = canvas.querySelector(`[data-flow-node="${CSS.escape(choice.nextSceneId)}"]`);
          if (!from || !to) return;

          const fromRect = from.getBoundingClientRect();
          const toRect = to.getBoundingClientRect();
          const start = {
            x: fromRect.left - canvasRect.left + fromRect.width,
            y: fromRect.top - canvasRect.top + 44 + index * 16
          };
          const end = {
            x: toRect.left - canvasRect.left,
            y: toRect.top - canvasRect.top + Math.min(toRect.height - 22, 48 + index * 7)
          };
          const dx = Math.max(80, Math.abs(end.x - start.x) * 0.42);
          const c1 = { x: start.x + dx, y: start.y };
          const c2 = { x: end.x - dx, y: end.y };
          const selected = scene.id === selectedSceneId || choice.nextSceneId === selectedSceneId;
          const labelX = (start.x + end.x) / 2;
          const labelY = (start.y + end.y) / 2 - 8;
          edges.push(`
            <path class="flow-line${selected ? " is-selected" : ""}" d="M ${start.x} ${start.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${end.x} ${end.y}"></path>
            <text class="flow-label" x="${labelX}" y="${labelY}">${escapeHtml(truncate(choice.text, 22))}</text>
          `);
        });
      });

      svg.innerHTML = `${marker}${edges.join("")}`;
    };

    const field = (label, path, value = "", type = "text", disabled = false, span = "") => {
      const common = `data-path="${escapeHtml(path)}"${disabled ? " disabled" : ""}`;
      let control = "";
      if (type === "textarea") {
        control = `<textarea ${common}>${escapeHtml(value)}</textarea>`;
      } else if (type === "code") {
        control = `<textarea class="code" ${common}>${escapeHtml(value)}</textarea>`;
      } else if (type === "select-speaker") {
        control = `
          <select ${common}>
            ${["", "left", "right"].map((option) => `<option value="${option}"${option === value ? " selected" : ""}>${option || "없음"}</option>`).join("")}
          </select>
        `;
      } else {
        control = `<input type="${type}" value="${escapeHtml(value)}" ${common}>`;
      }
      return `<label class="field ${span}"><span>${escapeHtml(label)}</span>${control}</label>`;
    };

    const choiceEditor = (choice, index) => `
      <article class="choice-card" data-choice-index="${index}">
        <div class="choice-card__top">
          <strong>선택지 ${index + 1}</strong>
          <button class="mini-btn" type="button" data-action="move-choice-up" data-choice-index="${index}">위로</button>
          <button class="mini-btn" type="button" data-action="move-choice-down" data-choice-index="${index}">아래로</button>
          <button class="mini-btn red" type="button" data-action="delete-choice" data-choice-index="${index}">삭제</button>
        </div>
        <div class="grid">
          ${choiceField(index, "id", "선택지 ID", choice.id || "")}
          ${choiceField(index, "nextSceneId", "이동할 장면 ID", choice.nextSceneId || "")}
          ${choiceField(index, "text", "버튼 문구", choice.text || "", "textarea", "full")}
          ${choiceField(index, "lockedText", "잠김 안내 문구", choice.lockedText || "", "textarea", "full")}
          <label class="field">
            <span>조사 완료 필요</span>
            <select data-choice-path="${index}.requiresInvestigation">
              <option value="false"${choice.requiresInvestigation ? "" : " selected"}>아니오</option>
              <option value="true"${choice.requiresInvestigation ? " selected" : ""}>예</option>
            </select>
          </label>
          <label class="field">
            <span>상호작용 완료 필요</span>
            <select data-choice-path="${index}.requiresInteraction">
              <option value="false"${choice.requiresInteraction ? "" : " selected"}>아니오</option>
              <option value="true"${choice.requiresInteraction ? " selected" : ""}>예</option>
            </select>
          </label>
        </div>
      </article>
    `;

    const choiceField = (index, key, label, value = "", type = "text", span = "") => {
      const attr = `data-choice-path="${index}.${key}"`;
      const control = type === "textarea"
        ? `<textarea ${attr}>${escapeHtml(value)}</textarea>`
        : `<input type="text" value="${escapeHtml(value)}" ${attr}>`;
      return `<label class="field ${span}"><span>${escapeHtml(label)}</span>${control}</label>`;
    };

    const interactionEditor = (scene) => {
      const interaction = scene.interaction;
      if (!interaction?.witnesses?.length) return "";
      return `
        <section class="card">
          <div class="card-head">
            <div>
              <h3>친구 증언 인터뷰</h3>
              <p class="hint">친구 카드에 보이는 미리보기와 실제 증언 문장을 수정합니다.</p>
            </div>
          </div>
          <div class="witness-list">
            ${interaction.witnesses.map((witness, index) => `
              <article class="witness-card">
                <div class="witness-card__top">
                  <strong>${escapeHtml(witness.name || `증언 ${index + 1}`)}</strong>
                </div>
                <div class="grid">
                  ${witnessField(index, "name", "이름", witness.name || "")}
                  ${witnessField(index, "label", "라벨", witness.label || "")}
                  ${witnessField(index, "preview", "카드 미리보기 문장", witness.preview || "", "textarea", "full")}
                  ${witnessField(index, "text", "상세 증언", witness.text || "", "textarea", "full")}
                  ${witnessField(index, "memo", "메모로 보낼 문장", witness.memo || "", "textarea", "full")}
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      `;
    };

    const witnessField = (index, key, label, value = "", type = "text", span = "") => {
      const attr = `data-witness-path="${index}.${key}"`;
      const control = type === "textarea"
        ? `<textarea ${attr}>${escapeHtml(value)}</textarea>`
        : `<input type="text" value="${escapeHtml(value)}" ${attr}>`;
      return `<label class="field ${span}"><span>${escapeHtml(label)}</span>${control}</label>`;
    };

    const setByPath = (target, path, value) => {
      const keys = path.split(".");
      let cursor = target;
      while (keys.length > 1) {
        const key = keys.shift();
        if (!cursor[key] || typeof cursor[key] !== "object") cursor[key] = {};
        cursor = cursor[key];
      }
      cursor[keys[0]] = value;
    };

    const coerceValue = (path, value) => {
      if (["casePanel.symptoms", "casePanel.facts", "casePanel.unknowns"].includes(path)) return parseLines(value);
      if (path === "interaction" || path === "investigation") {
        try {
          const parsed = JSON.parse(value);
          return parsed === null ? undefined : parsed;
        } catch (error) {
          throw new Error(`${path} JSON 형식이 올바르지 않습니다.`);
        }
      }
      return value;
    };

    const updateSceneField = (path, rawValue) => {
      const scene = getSelectedScene();
      const value = coerceValue(path, rawValue);
      if (value === undefined) {
        delete scene[path];
      } else {
        setByPath(scene, path, value);
      }
      markDirty(scene.id);
      renderPreview();
    };

    const updateChoiceField = (path, rawValue) => {
      const scene = getSelectedScene();
      const [indexText, key] = path.split(".");
      const index = Number(indexText);
      if (!scene.choices?.[index]) return;
      if (key === "requiresInvestigation" || key === "requiresInteraction") {
        scene.choices[index][key] = rawValue === "true";
      } else {
        scene.choices[index][key] = rawValue;
      }
      markDirty(scene.id);
      renderPreview();
    };

    const updateWitnessField = (path, rawValue) => {
      const scene = getSelectedScene();
      const [indexText, key] = path.split(".");
      const index = Number(indexText);
      if (!scene.interaction?.witnesses?.[index]) return;
      scene.interaction.witnesses[index][key] = rawValue;
      markDirty(scene.id);
      renderPreview();
    };

    const renderPreview = () => {
      const scene = getSelectedScene();
      $("#preview").innerHTML = `
        <article class="preview-scene">
          <span class="badge">${escapeHtml(scene.stepLabel || "")}</span>
          <h2>${escapeHtml(scene.title || "")}</h2>
          <p class="hint">${escapeHtml(scene.location || "")} · ${escapeHtml(scene.phase || "")}</p>
          <div class="dialogue">
            <strong>${escapeHtml(scene.dialogue?.name || "대사")}</strong>
            <div>${escapeHtml(scene.dialogue?.text || "").replaceAll("\n", "<br>")}</div>
          </div>
          <div class="preview-choices">
            ${(scene.choices || []).map((choice, index) => `
              <div class="preview-choice">${index + 1}. ${escapeHtml(choice.text || "")}</div>
            `).join("") || "<p class='hint'>선택지 없음</p>"}
          </div>
        </article>
      `;
    };

    const addChoice = () => {
      const scene = getSelectedScene();
      if (!scene.choices) scene.choices = [];
      scene.choices.push({
        id: `choice_${Date.now()}`,
        text: "새 선택지",
        nextSceneId: scene.id
      });
      markDirty(scene.id);
      renderEditor();
    };

    const duplicateScene = () => {
      const current = getSelectedScene();
      const episode = data.episodes.find((item) => item.scenes.some((scene) => scene.id === current.id));
      const index = episode.scenes.findIndex((scene) => scene.id === current.id);
      const copy = structuredClone(current);
      copy.id = `${current.id}_copy`;
      copy.title = `${current.title || current.id} 복사본`;
      episode.scenes.splice(index + 1, 0, copy);
      selectedSceneId = copy.id;
      markDirty(copy.id);
      renderAll();
    };

    const moveChoice = (index, direction) => {
      const scene = getSelectedScene();
      const next = index + direction;
      if (!scene.choices || next < 0 || next >= scene.choices.length) return;
      [scene.choices[index], scene.choices[next]] = [scene.choices[next], scene.choices[index]];
      markDirty(scene.id);
      renderEditor();
    };

    const deleteChoice = (index) => {
      const scene = getSelectedScene();
      scene.choices.splice(index, 1);
      markDirty(scene.id);
      renderEditor();
    };

    const makeDataJs = () => `window.gameData = ${JSON.stringify(data, null, 2)};\n`;
    const makeCodexRequest = () => {
      const dirtyScenes = scenes()
        .filter(({ scene }) => dirtySceneIds.has(scene.id))
        .map(({ scene }) => ({
          id: scene.id,
          title: scene.title,
          dialogue: scene.dialogue,
          choices: scene.choices,
          casePanel: scene.casePanel,
          interaction: scene.interaction || null,
          investigation: scene.investigation || null
        }));
      return [
        "아래 수정 내용을 현재 프로젝트의 assets/data/case01_game_data.js에 반영하고 GitHub Pages에 발행해줘.",
        "",
        "수정된 장면 요약 JSON:",
        JSON.stringify(dirtyScenes, null, 2),
        "",
        "전체 수정본 JS:",
        makeDataJs()
      ].join("\n");
    };

    const openExport = () => {
      $("#exportText").value = makeCodexRequest();
      $("#exportDrawer").classList.add("is-open");
      $("#exportDrawer").setAttribute("aria-hidden", "false");
    };

    const closeExport = () => {
      $("#exportDrawer").classList.remove("is-open");
      $("#exportDrawer").setAttribute("aria-hidden", "true");
    };

    const downloadJs = () => {
      const blob = new Blob([makeDataJs()], { type: "text/javascript;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "case01_game_data.edited.js";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    };

    const saveDraft = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ data, selectedSceneId, dirtySceneIds: [...dirtySceneIds] }));
      updateStatus("임시저장 완료");
    };

    const loadDraft = () => {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        updateStatus("임시저장 없음");
        return;
      }
      const draft = JSON.parse(raw);
      data = draft.data;
      selectedSceneId = draft.selectedSceneId || selectedSceneId;
      dirtySceneIds.clear();
      (draft.dirtySceneIds || []).forEach((id) => dirtySceneIds.add(id));
      renderAll();
      updateStatus("임시저장 불러옴");
    };

    const resetData = () => {
      if (!confirm("현재 편집 내용을 버리고 처음 상태로 되돌릴까요?")) return;
      data = structuredClone(originalData);
      selectedSceneId = data.episodes[0]?.scenes[0]?.id || "";
      dirtySceneIds.clear();
      renderAll();
    };

    const renderAll = () => {
      renderSceneList();
      renderEditor();
      $("#editViewBtn").classList.toggle("is-active", activeView === "edit");
      $("#flowViewBtn").classList.toggle("is-active", activeView === "flow");
      updateStatus();
    };

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (target.matches("[data-path]")) {
        try {
          updateSceneField(target.dataset.path, target.value);
        } catch (error) {
          updateStatus(error.message);
        }
      }
      if (target.matches("[data-choice-path]")) updateChoiceField(target.dataset.choicePath, target.value);
      if (target.matches("[data-witness-path]")) updateWitnessField(target.dataset.witnessPath, target.value);
      if (target.id === "sceneSearch") renderSceneList();
    });

    document.addEventListener("click", async (event) => {
      const sceneButton = event.target.closest("[data-scene-id]");
      if (sceneButton) {
        selectedSceneId = sceneButton.dataset.sceneId;
        renderAll();
        return;
      }

      const flowNode = event.target.closest("[data-flow-node]");
      if (flowNode) {
        selectedSceneId = flowNode.dataset.flowNode;
        renderAll();
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (actionButton) {
        const action = actionButton.dataset.action;
        const index = Number(actionButton.dataset.choiceIndex);
        if (action === "add-choice") addChoice();
        if (action === "delete-choice") deleteChoice(index);
        if (action === "move-choice-up") moveChoice(index, -1);
        if (action === "move-choice-down") moveChoice(index, 1);
        if (action === "duplicate-scene") duplicateScene();
        if (action === "fit-flow") {
          const wrap = $("#flowWrap");
          if (wrap) {
            wrap.scrollTo({ left: 0, top: 0, behavior: "smooth" });
          }
        }
        return;
      }
    });

    $("#editViewBtn").addEventListener("click", () => {
      activeView = "edit";
      renderAll();
    });
    $("#flowViewBtn").addEventListener("click", () => {
      activeView = "flow";
      renderAll();
    });
    $("#saveDraftBtn").addEventListener("click", saveDraft);
    $("#loadDraftBtn").addEventListener("click", loadDraft);
    $("#downloadBtn").addEventListener("click", downloadJs);
    $("#exportBtn").addEventListener("click", openExport);
    $("#resetBtn").addEventListener("click", resetData);
    $("#closeExportBtn").addEventListener("click", closeExport);
    $("#copyExportBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText($("#exportText").value);
      updateStatus("내보내기 내용 복사됨");
    });
    window.addEventListener("resize", () => {
      if (activeView === "flow") window.requestAnimationFrame(drawFlowLines);
    });

    renderAll();
  </script>
</body>
</html>
